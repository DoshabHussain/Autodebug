[project]
name = "autodebug"
version = "0.1.0"
description = "Autonomous, evidence-producing debugging agent on a local LLM (no Docker)"
requires-python = ">=3.10"
dependencies = []          # standard library only; the *target* repo needs pytest

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
autodebug = "autodebug.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
